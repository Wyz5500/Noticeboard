name: adventurers-guild

x-app-environment: &app-environment
  DATABASE_URL: postgresql://guild:guild@postgres:5432/guild
  HOST: 0.0.0.0
  PORT: '3000'

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_USER: guild
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guild -d guild']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - guild-postgres:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      target: builder
    command: npm run db:seed
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  app:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    init: true
    ports:
      - '3000:3000'
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  guild-postgres:
