services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: noticeboard
      POSTGRES_PASSWORD: noticeboard
      POSTGRES_USER: noticeboard
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noticeboard -d noticeboard']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT-}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
