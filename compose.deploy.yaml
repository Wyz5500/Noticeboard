x-app-environment: &app-environment
  DATABASE_URL: postgresql://noticeboard:noticeboard@postgres:5432/noticeboard
  HOST: 0.0.0.0
  PORT: '3000'

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: noticeboard
      POSTGRES_PASSWORD: noticeboard
      POSTGRES_USER: noticeboard
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noticeboard -d noticeboard']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      target: builder
    command: npm run db:seed
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  app:
    build:
      context: .
      target: production
    environment: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    init: true
    ports:
      - '127.0.0.1:3000:3000'
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  postgres-data:
    name: noticeboard-postgres
